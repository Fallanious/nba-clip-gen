name: integration

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (clean venv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install and test in a clean venv
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pytest -m "not integration" -q

  integration:
    name: Neon integration tests
    runs-on: ubuntu-latest
    steps:
      - id: check_db
        env:
          DATABASE_URL: ${{ secrets.NEON_DEV_DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "has_db=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_db=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.check_db.outputs.has_db == 'true'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.check_db.outputs.has_db == 'true'
        with:
          python-version: "3.12"
      - name: Install test dependencies
        if: steps.check_db.outputs.has_db == 'true'
        run: pip install --require-hashes -r requirements.lock
      - name: Guard Neon target
        if: steps.check_db.outputs.has_db == 'true'
        env:
          DATABASE_URL: ${{ secrets.NEON_DEV_DATABASE_URL }}
          # Endpoint id of Neon branch br-odd-smoke-b465tvf8 (set in repo vars; never a secret).
          NEON_DEV_ENDPOINT_ID: ${{ vars.NEON_DEV_ENDPOINT_ID }}
          NEON_DEV_REGION: ${{ vars.NEON_DEV_REGION }}
        run: python scripts/ci_guard_db.py
      - name: Run integration tests against Neon
        if: steps.check_db.outputs.has_db == 'true'
        env:
          DATABASE_URL: ${{ secrets.NEON_DEV_DATABASE_URL }}
          APP_ENV: dev
        run: pytest -m integration -q
